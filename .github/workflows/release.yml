name: Deploy to itch.io

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-itch:
    strategy:
        matrix:
            include:
                - package: win
                  channel: win

                - package: mac
                  channel: osx

                - package: linux
                  channel: linux

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Publish to itch.io
        uses: KagariSoft/renpy-ci@v1
        with:
          renpy-version: '8.5.3'
          game-dir: '.'
          package: ${{ matrix.package }}
          publish-itch: 'true'
          itch-target: ${{ secrets.BUTLER_USER_SLASH_GAME }}
          itch-channel: ${{ matrix.channel }}
          butler-key: ${{ secrets.BUTLER_API_KEY }}

        env:
          RENPY_DIST_PATH: ${{ runner.temp }}/renpy-dists
          RENPY_SDK_DIR: ${{ runner.temp }}/renpy-8.5.3-sdk

      - name: Install Ren'py web support
        working-directory: ${{ runner.temp }}
        run: |
          wget https://www.renpy.org/dl/release/renpy-8.5.3-web.zip
          unzip -q renpy-8.5.3-web.zip -d "$RENPY_SDK_DIR"

      - name: Build web
        run: |
          rm -rf "$RENPY_DIST_PATH"
          mkdir -p "$RENPY_DIST_PATH"
          cd "$RENPY_SDK_DIR"
          ./renpy.sh launcher web_build "$GITHUB_WORKSPACE" \ 
          --destination "$RENPY_DIST_PATH/web"

      - name: Inspect web build
        run: |
           WEB_ZIP="$RENPY_DIST_PATH/web.zip"

           echo "=== Web ZIP ==="
           ls -lh "$WEB_ZIP"

           echo "=== File count ==="
           unzip -Z1 "$WEB_ZIP" | wc -l

           echo "=== Contents ==="
           unzip -Z1 "$WEB_ZIP" | head -50

           echo "=== Checking for accidental build output ==="
           if unzip -Z1 "$WEB_ZIP" | grep -q 'Dramaturgy-1.0-dists'; then
             echo "ERROR: Build output was accidentally included in Web ZIP!"
             exit 1
           fi

           echo "Web build looks clean."

      - name: Inspect game.zip
        run: |
          GAME_ZIP="$RENPY_DIST_PATH/web/game.zip"

          if [ ! -f "$GAME_ZIP" ]; then
            echo "game.zip not found!"
            exit 1
          fi

          echo "game.zip file count:"
          unzip -Z1 "$GAME_ZIP" | wc -l

      - name: Upload web build
        run: |
          butler push \
          "$RENPY_DIST_PATH/web.zip" \
          "${{ secrets.BUTLER_USER_SLASH_GAME }}:html5" \
          --userversion "${{ github.ref_name }}"
        
        env:
            BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

      - name: Check project for build artifacts
        run: |
          echo "=== Project root ==="
          find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -print

      - name: Analyze web ZIP
        run: |
          WEB_ZIP="$RENPY_DIST_PATH/web/game.zip"

          echo "=== File count ==="
          unzip -Z1 "$WEB_ZIP" | wc -l

          echo "=== Files by top-level directory ==="
          unzip -Z1 "$WEB_ZIP" | awk -F/ '{print $1}' | sort | uniq -c | sort -nr

          echo "=== Game files ==="
          unzip -Z1 "$WEB_ZIP" | grep '^game/' | head -100